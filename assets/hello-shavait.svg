<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title desc">
<title id="title">Hello, I'm Shavait Pandita</title>
<desc id="desc">A midnight and mint introduction with a floating robot companion. AI, full-stack, and curiosity.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c171e"/><stop offset="1" stop-color="#112d30"/></linearGradient>
 <linearGradient id="shell" x2="0.8" y2="1"><stop stop-color="#c0ffe7"/><stop offset="1" stop-color="#4dcba7"/></linearGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#79e8c2" stroke-opacity=".055"/></pattern>
 <style>
 .float{animation:float 4s ease-in-out infinite}.eye{animation:blink 5s infinite;transform-box:fill-box;transform-origin:center}.signal{animation:pulse 2s ease-in-out infinite}
 @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
 @keyframes blink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.12)}}
 @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
 @media(prefers-reduced-motion:reduce){.float,.eye,.signal{animation:none}}
 </style>
</defs>
